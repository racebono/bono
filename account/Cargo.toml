[package]
name = "bono-account"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
webbrowser = "1"

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
