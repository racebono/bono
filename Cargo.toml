[package]
name = "lambiase"
version = "0.1.0"
edition = "2024"

[dependencies]
pin-project = "1.1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
] }
imgui-winit-support = "0.13.0"
sdl3 = { version = "0.20.0", features = [
    "build-from-source-static",
    "main",
    "ttf",
] }
sdl3-main = "0.7.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
camino = { version = "1.2.6", features = ["serde1"] }
log = "0.4.34"

[profile.dev.package.sdl3-ttf-sys]
opt-level = 3
debug = false

[workspace]
members = ["xtask"]
