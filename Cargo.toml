[package]
name = "lambiase"
version = "0.1.0"
edition = "2024"

[dependencies]
pin-project = "1.1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
] }
sdl3 = { version = "0.20.0", features = ["build-from-source-static", "main"] }
sdl3-main = "0.7.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
camino = { version = "1.2.6", features = ["serde1"] }
log = "0.4.34"
egui = "0.36.2"
egui-sdl3 = { git = "https://github.com/Aandreba/egui-sdl3", branch = "main", features = ["canvas-backend"], default-features = false }

[workspace]
members = ["xtask"]
