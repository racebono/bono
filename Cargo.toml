[package]
name = "bono"
version = "0.1.0"
edition = "2024"

[dependencies]
bono-updater = { path = "updater" }
base64 = "0.22"
keyring = { version = "3.6.3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
    "crypto-rust",
] }
sha2 = "0.10"
md-5 = "0.10"
webbrowser = "1"
bono-sim = { path = "sim" }
bono-i18n = { path = "i18n" }
pin-project = "1.1.13"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
tokio = { version = "^1.54.1", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
    "net",
    "macros",
    "time",
] }
sdl3 = { version = "0.20.0", features = ["build-from-source-static", "main"] }
sdl3-main = "0.7.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
camino = { version = "1.2.6", features = ["serde1"] }
log = "0.4.34"
egui = { version = "0.36.2", features = [
    "default_fonts",
], default-features = false }
egui-sdl3 = { git = "https://github.com/Aandreba/egui-sdl3", branch = "main", features = [
    "canvas-backend",
], default-features = false }
whisper-rs = { git = "https://github.com/Aandreba/whisper-rs", branch = "master", features = [
    "log_backend",
    "raw-api",
] }
oneshot = { version = "0.2.1", features = ["std"] }
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
egui_extras = "0.36.2"
ort = "=2.0.0-rc.13"
unicode-normalization = "0.1.25"
wide = "1.7.1"
rayon = "1.12.0"
rand = "0.10.3"
httpdate = "1.0.3"
slab = "0.4.12"
crossbeam = "0.8.5"
utils-atomics = { version = "1.1.2", features = ["futures"] }
futures = { version = "0.3.34", default-features = false, features = [
    "std",
    "async-await",
] }
steamlocate = "2.1.1"
# Which language a typed question is in. Each language's model is built into the binary (a few
# MB each), so only common ones are by default: `all-languages` adds the rest that have voices
lingua = { version = "1.8.0", default-features = false, features = [
    "catalan",
    "chinese",
    "dutch",
    "english",
    "french",
    "german",
    "italian",
    "japanese",
    "korean",
    "portuguese",
    "spanish",
] }
hf-hub = { version = "1.0.0", optional = true }
ollama-rs = { version = "0.3.6", features = [
    "stream",
    "rustls",
], optional = true }
phf = { version = "0.14.0", features = ["macros"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = [
    "bold",
] }
fern = { version = "0.7.1", features = ["colored", "chrono"] }
humantime = "2.4.0"

[target.'cfg(windows)'.dependencies]
# Steam's per-game "Running" flag, and watching it change
winreg = "0.56.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Metal ships with the OS, so it needs no SDK and is always on.
# Apple targets also get BLAS from the Accelerate framework.
whisper-rs = { git = "https://github.com/Aandreba/whisper-rs", branch = "master", features = [
    "metal",
] }

# Opt-in whisper backends. Each needs its SDK installed at build time.
[features]
default = ["cuda", "vulkan"]
# Windows, Linux. Needs the CUDA toolkit (`CUDA_PATH` on Windows)
cuda = ["whisper-rs/cuda"]
# Linux only: whisper-rs-sys refuses to build it on Windows (broken ROCm 5.7). Needs ROCm (`HIP_PATH`)
hipblas = ["whisper-rs/hipblas"]
# Windows, Linux. Needs Intel oneAPI (`icx`/`icpx` compilers)
intel-sycl = ["whisper-rs/intel-sycl"]
# Windows, Linux. Needs OpenBLAS (`BLAS_INCLUDE_DIRS`, optionally `OPENBLAS_PATH`)
openblas = ["whisper-rs/openblas"]
# Windows, Linux. Needs the Vulkan SDK (`VULKAN_SDK`)
vulkan = ["whisper-rs/vulkan"]
# Detects typed questions in every language there are voices for (about 180 MB more)
all-languages = [
    "lingua/albanian",
    "lingua/arabic",
    "lingua/armenian",
    "lingua/basque",
    "lingua/bengali",
    "lingua/bokmal",
    "lingua/bulgarian",
    "lingua/catalan",
    "lingua/czech",
    "lingua/danish",
    "lingua/estonian",
    "lingua/finnish",
    "lingua/georgian",
    "lingua/greek",
    "lingua/hebrew",
    "lingua/hindi",
    "lingua/hungarian",
    "lingua/icelandic",
    "lingua/indonesian",
    "lingua/kazakh",
    "lingua/latvian",
    "lingua/lithuanian",
    "lingua/marathi",
    "lingua/nynorsk",
    "lingua/persian",
    "lingua/polish",
    "lingua/romanian",
    "lingua/russian",
    "lingua/serbian",
    "lingua/slovak",
    "lingua/slovene",
    "lingua/swahili",
    "lingua/swedish",
    "lingua/telugu",
    "lingua/thai",
    "lingua/turkish",
    "lingua/ukrainian",
    "lingua/urdu",
    "lingua/vietnamese",
    "lingua/welsh",
]

[workspace]
members = ["xtask", "sim", "lmu", "i18n", "phonemizer", "updater"]

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "test-util"] }

[build-dependencies]
bindgen = "0.73.2"
ureq = "3.4.2"
winresource = "0.1.34"

# espeak-rs-sys links the debug CRT (`msvcrtd`) when its build script has debug assertions,
# which clashes with the release CRT (`msvcrt`) Rust and the other native dependencies link
[profile.dev.package.espeak-rs-sys]
debug-assertions = false
