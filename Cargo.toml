[package]
name = "lambiase"
version = "0.1.0"
edition = "2024"

[dependencies]
pin-project = "1.1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
    "macros",
] }
sdl3 = { version = "0.20.0", features = ["build-from-source-static", "main"] }
sdl3-main = "0.7.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
camino = { version = "1.2.6", features = ["serde1"] }
log = "0.4.34"
egui = { version = "0.36.2", features = [
    "persistence",
], default-features = false }
egui-sdl3 = { git = "https://github.com/Aandreba/egui-sdl3", branch = "main", features = [
    "canvas-backend",
], default-features = false }
simple_logger = "5.2.0"

# Build SDL in Release so it links the release CRT (`msvcrt`) like Rust does, not `MSVCRTD`
[profile.dev.package.sdl3-sys]
opt-level = 3
debug = false

[workspace]
members = ["xtask"]
