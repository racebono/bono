[package]
name = "lambiase"
version = "0.1.0"
edition = "2024"

[dependencies]
pin-project = "1.1.13"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tokio = { version = "1.53.2", features = [
    "rt-multi-thread",
    "sync",
    "fs",
    "io-util",
    "macros",
] }
sdl3 = { version = "0.20.0", features = ["build-from-source-static", "main"] }
sdl3-main = "0.7.0"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
camino = { version = "1.2.6", features = ["serde1"] }
log = "0.4.34"
egui = { version = "0.36.2", features = [
    "persistence",
], default-features = false }
egui-sdl3 = { git = "https://github.com/Aandreba/egui-sdl3", branch = "main", features = [
    "canvas-backend",
], default-features = false }
simple_logger = "5.2.0"
whisper-rs = { version = "0.16.0", features = ["log_backend"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# Metal ships with the OS, so it needs no SDK and is always on.
# Apple targets also get BLAS from the Accelerate framework.
whisper-rs = { version = "0.16.0", features = ["metal"] }

# Opt-in whisper backends. Each needs its SDK installed at build time.
[features]
default = ["cuda", "vulkan"]
# Windows, Linux. Needs the CUDA toolkit (`CUDA_PATH` on Windows)
cuda = ["whisper-rs/cuda"]
# Linux only: whisper-rs-sys refuses to build it on Windows (broken ROCm 5.7). Needs ROCm (`HIP_PATH`)
hipblas = ["whisper-rs/hipblas"]
# Windows, Linux. Needs Intel oneAPI (`icx`/`icpx` compilers)
intel-sycl = ["whisper-rs/intel-sycl"]
# Windows, Linux. Needs OpenBLAS (`BLAS_INCLUDE_DIRS`, optionally `OPENBLAS_PATH`)
openblas = ["whisper-rs/openblas"]
# Windows, Linux. Needs the Vulkan SDK (`VULKAN_SDK`)
vulkan = ["whisper-rs/vulkan"]

# Build SDL in Release so it links the release CRT (`msvcrt`) like Rust does, not `MSVCRTD`
[profile.dev.package.sdl3-sys]
opt-level = 3
debug = false

[workspace]
members = ["xtask"]
